name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }} \
        ./backend

    - name: Push Backend
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}

    - name: Build Frontend
      run: |
        docker build \
        -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }} \
        ./frontend

    - name: Push Frontend
      run: |
        docker push \
        ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}

    - name: Update Helm values.yaml
      run: |

        sed -i "/frontend:/,/tag:/ s/tag:.*/tag: ${{ github.sha }}/" \
        helm/task-app/values.yaml

        sed -i "/backend:/,/tag:/ s/tag:.*/tag: ${{ github.sha }}/" \
        helm/task-app/values.yaml
        
    - name: Commit Changes
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add helm/task-app/values.yaml
        git commit -m "Updated image tags"
        git push
